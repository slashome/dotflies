[package]
name = "dotflies"
version = "0.1.0"
edition = "2024"
description = "Version the configuration of the software you use, and reinstall it with a single command."
repository = "https://github.com/slashome/dotflies"

[dependencies]
anyhow = "1"
camino = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"

[dev-dependencies]
tempfile = "3"
